name: Feature request
description: Propose a focused addition or API improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user need before describing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Include a small TypeScript example when the public API would change.
      render: tsx
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - All platforms
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include React Native/Expo and dependency versions when compatibility affects the request.
      placeholder: React Native, Expo, Reanimated, Gesture Handler, and Dial Slider versions

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I am willing to update tests and documentation if I implement this.
          required: false
